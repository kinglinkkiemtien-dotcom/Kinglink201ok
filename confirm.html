<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingLink - Xác Nhận Vượt Link</title>
    <style>
        :root{--bg:#0a0e17;--card:#111827;--ac2:#f59e0b;--gr:#22c55e;--rd:#ef4444;--tx:#e2e8f0;--sub:#94a3b8}
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
        body{background:var(--bg);color:var(--tx);min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}
        .container{background:var(--card);padding:40px 30px;border-radius:20px;text-align:center;border:2px solid var(--ac2);max-width:450px;width:100%}
        .container .big-number{font-size:80px;font-weight:800;color:var(--ac2);animation:pulse 1s infinite;margin:15px 0}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
        .container .info{font-size:16px;color:var(--gr);margin:10px 0}
        .container .reward{font-size:24px;font-weight:bold;color:var(--gr);margin:15px 0;background:rgba(34,197,94,0.1);padding:10px;border-radius:8px}
        .container .warning{color:#fca5a5;font-size:11px;margin-top:15px}
        .progress-bar{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin:10px 0;overflow:hidden}
        .progress-fill{height:100%;background:var(--gr);width:0%}
        .btn{display:inline-block;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;border:none;font-size:13px;margin:5px}
        .btn-o{background:var(--ac2);color:#000}
        .error-box{background:rgba(239,68,68,0.1);border:1px solid var(--rd);padding:20px;border-radius:10px;text-align:center;max-width:450px;width:100%}
        .error-box h3{color:var(--rd)}
    </style>
</head>
<body>

<div id="errorDisplay" class="error-box" style="display:none">
    <h3>⚠️ Truy Cập Không Hợp Lệ</h3>
    <p style="color:var(--sub);font-size:12px" id="errorMsg"></p>
</div>

<div id="mainDisplay" class="container" style="display:none">
    <div style="font-size:60px">💰</div>
    <h2 style="color:var(--ac2)">ĐIỂM ĐANG ĐƯỢC THÊM</h2>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="big-number" id="countdownDisplay">3</div>
    <p class="info">Đang xử lý...</p>
    <div class="reward" id="rewardDisplay">+10,000đ</div>
    <p class="warning">⚠️ Đừng tải lại trang!</p>
</div>

<div id="successDisplay" class="container" style="display:none">
    <div style="font-size:60px">✅</div>
    <h2 style="color:var(--gr)">VƯỢT LINK THÀNH CÔNG!</h2>
    <div class="reward" id="successReward">+10,000đ</div>
    <p style="color:var(--sub);font-size:12px">Điểm đã được cộng. Hãy quay lại KingLink!</p>
    <button class="btn btn-o" onclick="goBackToKingLink()">🔙 VỀ KINGLINK</button>
</div>

<script>
// Lấy tham số từ URL
const urlParams = new URLSearchParams(window.location.search);
const userId = urlParams.get('uid');
const amount = urlParams.get('amount');
const platform = urlParams.get('plat');
const token = urlParams.get('token');
const timestamp = urlParams.get('t');

function showError(msg) {
    document.getElementById('errorDisplay').style.display = 'block';
    document.getElementById('mainDisplay').style.display = 'none';
    document.getElementById('successDisplay').style.display = 'none';
    document.getElementById('errorMsg').textContent = msg || 'Truy cập không hợp lệ.';
}

function isValidRequest() {
    if (!userId || !amount || !token || !timestamp) {
        showError('Thiếu thông tin. Vui lòng vượt link từ KingLink.');
        return false;
    }
    const requestTime = parseInt(timestamp);
    if (Date.now() - requestTime > 5 * 60 * 1000) {
        showError('Link đã hết hạn (5 phút). Vui lòng thử lại.');
        return false;
    }
    const usedTokens = JSON.parse(localStorage.getItem('kl_used_tokens') || '[]');
    if (usedTokens.includes(token)) {
        showError('Link này đã được sử dụng! Không thể dùng lại.');
        return false;
    }
    return true;
}

function processReward() {
    // Đánh dấu token đã dùng
    const usedTokens = JSON.parse(localStorage.getItem('kl_used_tokens') || '[]');
    usedTokens.push(token);
    if (usedTokens.length > 100) usedTokens.shift();
    localStorage.setItem('kl_used_tokens', JSON.stringify(usedTokens));

    // Cập nhật user trong localStorage (dùng chung key 'ku' với index.html)
    const users = JSON.parse(localStorage.getItem('ku') || '[]');
    const userIndex = users.findIndex(u => u.e === userId || u.email === userId);
    
    if (userIndex >= 0) {
        users[userIndex].bal = (users[userIndex].bal || 0) + parseInt(amount);
        users[userIndex].mtc = (users[userIndex].mtc || 0) + 1;
        users[userIndex].dtc = (users[userIndex].dtc || 0) + 1;
        
        if (platform && users[userIndex].pc) {
            users[userIndex].pc[platform] = (users[userIndex].pc[platform] || 0) + 1;
        }
        
        localStorage.setItem('ku', JSON.stringify(users));

        // Gửi tín hiệu cho KingLink (index.html)
        localStorage.setItem('kl_task_completed', JSON.stringify({
            userId: userId,
            amount: parseInt(amount),
            platform: platform || 'KingLink',
            token: token,
            timestamp: Date.now()
        }));

        // Hiển thị thành công
        document.getElementById('mainDisplay').style.display = 'none';
        document.getElementById('successDisplay').style.display = 'block';
        document.getElementById('successReward').textContent = '+' + parseInt(amount).toLocaleString() + 'đ';

        // Tự động đóng tab sau 3 giây
        setTimeout(() => {
            if (window.opener) {
                window.opener.focus();
                window.close();
            }
        }, 3000);
    } else {
        showError('Không tìm thấy tài khoản: ' + userId);
    }
}

function startCountdown() {
    document.getElementById('mainDisplay').style.display = 'block';
    document.getElementById('errorDisplay').style.display = 'none';
    document.getElementById('successDisplay').style.display = 'none';

    document.getElementById('rewardDisplay').textContent = '+' + parseInt(amount).toLocaleString() + 'đ';

    let count = 3;
    const countdownEl = document.getElementById('countdownDisplay');
    const progressFill = document.getElementById('progressFill');
    countdownEl.textContent = count;

    const interval = setInterval(() => {
        count--;
        countdownEl.textContent = count;
        progressFill.style.width = ((3 - count) / 3 * 100) + '%';
        if (count <= 0) {
            clearInterval(interval);
            processReward();
        }
    }, 1000);
}

function goBackToKingLink() {
    if (window.opener) {
        window.opener.focus();
    }
    window.close();
}

// Chặn chuột phải
document.addEventListener('contextmenu', e => e.preventDefault());

// Chặn F5
window.addEventListener('beforeunload', function(e) {
    if (document.getElementById('mainDisplay').style.display !== 'none') {
        e.preventDefault();
        e.returnValue = '';
    }
});

window.onload = function() {
    if (isValidRequest()) {
        startCountdown();
        // Thay đổi URL để chống dùng lại
        if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, window.location.origin + window.location.pathname + '?done=' + Date.now());
        }
    }
};
</script>
</body>
</html>
